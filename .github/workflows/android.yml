name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [arena/d699cecb-blockgame]
    paths-ignore: ['operations/**', 'admin-tools/**', '.github/workflows/operations.yml', '**/*.md', 'download-site/**']
jobs:
  apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blokko-android-test-signing-v1
      - name: Prepare test signing key and fingerprints
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Blokko Debug,O=Android,C=TR"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > firebase-fingerprints.txt
          cat firebase-fingerprints.txt
          cat firebase-fingerprints.txt >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm test
      - name: Test administrator upgrade helper
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm ci --prefix functions
      - run: npm --prefix functions run check
      - name: Verify Firestore access rules in an isolated emulator
        run: |
          set -o pipefail
          npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-kelime-seyyahi "npm run test:rules" 2>&1 | tee rules-output.log
      - name: Publish rule diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const summary=fs.existsSync('rules-output.log')?fs.readFileSync('rules-output.log','utf8').slice(-50000):'Rules step did not produce a log.';
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({name:'Firestore rule diagnostics',head_sha:process.env.GITHUB_SHA,status:'completed',conclusion:'neutral',output:{title:'Firestore emulator diagnostics',summary:'```text\n'+summary+'\n```'}})});
          if(!response.ok)throw Error('Diagnostic check could not be published: '+response.status);
          JS
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Verify APK signer matches Firebase Android client
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > apk-signer.txt
          cat apk-signer.txt
          cat apk-signer.txt >> firebase-fingerprints.txt
          node --input-type=module -e "import fs from 'node:fs'; const text=fs.readFileSync('apk-signer.txt','utf8'); const sha=text.match(/certificate SHA-1 digest: ([a-f0-9]+)/i)?.[1]?.toLowerCase(); const config=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8')); if(!sha || !config.client.some(c=>c.oauth_client.some(o=>o.client_type===1 && o.android_info.package_name==='com.blokko.game' && o.android_info.certificate_hash.toLowerCase()===sha))) throw Error('APK signer does not match Firebase OAuth configuration');"
      - uses: actions/upload-artifact@v4
        with:
          name: Blokko-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            firebase-fingerprints.txt
      - name: Attach certificate fingerprints to check summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f firebase-fingerprints.txt ]; then
            CHECK_ID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "apk") | .id' | head -1)
            jq -n --rawfile summary firebase-fingerprints.txt '{output:{title:"Firebase signing fingerprints",summary:$summary}}' > check-output.json
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" --input check-output.json
          fi

      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk Blokko.apk
          cp Blokko.apk Kelime-Seyyahi.apk
          sha256sum Kelime-Seyyahi.apk Blokko.apk > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version for a new public release."
            echo "This commit was built and tested; no new release was published. See the build artifact."
            exit 0
          fi
          gh release create "$TAG" Kelime-Seyyahi.apk Blokko.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Kelime Seyyahı $VERSION" --notes "1.11.1: Premium paketi yenilendi. Yeni bölümün ilk tamamlamasında 2× altın ve 40 kupa; bayramla birleşince 80 kupa. Günlük görev altını 2×, ipucu miktarı aynı. 4 saç, 4 kıyafet ve 4 şapka aktif Premium ile kalıcı açılır. Sınırsız Harf aç kaldırıldı; fiyat 99,99 TL/yıl ve mevcut bitiş tarihleri değişmedi. ÖNEMLİ: Premium v2 ve eşitleme için şema 5 Firestore kurallarını yayımlayın; LIVE-SETUP.md ve admin-tools/upgrade-premium-v2.py rehberini izleyin. Bu APK üretim ayarlarını kendiliğinden değiştirmez. Normal çevrimdışı oyun, 124 bölüm ve kayıtlar korunur; silmeden üzerine kurun. Premium çarpanları sunucu onayı gerektirir; eski bakiyeler ve alınmış ödüller katlanmaz. Destek: tirezteknoloji@gmail.com."
