name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [arena/d699cecb-blockgame]
jobs:
  apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blokko-android-test-signing-v1
      - name: Prepare test signing key and fingerprints
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Blokko Debug,O=Android,C=TR"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > firebase-fingerprints.txt
          cat firebase-fingerprints.txt
          cat firebase-fingerprints.txt >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix functions
      - run: npm --prefix functions run check
      - name: Verify Firestore access rules in an isolated emulator
        run: npx --yes firebase-tools@15.34.2 emulators:exec --only firestore --project demo-kelime-seyyahi "npm run test:rules"
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Verify APK signer matches Firebase Android client
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > apk-signer.txt
          cat apk-signer.txt
          cat apk-signer.txt >> firebase-fingerprints.txt
          node --input-type=module -e "import fs from 'node:fs'; const text=fs.readFileSync('apk-signer.txt','utf8'); const sha=text.match(/certificate SHA-1 digest: ([a-f0-9]+)/i)?.[1]?.toLowerCase(); const config=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8')); if(!sha || !config.client.some(c=>c.oauth_client.some(o=>o.client_type===1 && o.android_info.package_name==='com.blokko.game' && o.android_info.certificate_hash.toLowerCase()===sha))) throw Error('APK signer does not match Firebase OAuth configuration');"
      - uses: actions/upload-artifact@v4
        with:
          name: Blokko-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            firebase-fingerprints.txt
      - name: Attach certificate fingerprints to check summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f firebase-fingerprints.txt ]; then
            CHECK_ID=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "apk") | .id' | head -1)
            jq -n --rawfile summary firebase-fingerprints.txt '{output:{title:"Firebase signing fingerprints",summary:$summary}}' > check-output.json
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" --input check-output.json
          fi

      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk Blokko.apk
          cp Blokko.apk Kelime-Seyyahi.apk
          sha256sum Kelime-Seyyahi.apk Blokko.apk > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version for a new public release."
            exit 1
          fi
          gh release create "$TAG" Kelime-Seyyahi.apk Blokko.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Kelime Seyyahı $VERSION" --notes "Android test sürümü. Mevcut uygulamanın üzerine yükleyin. Puan yerine sıfırdan kupa: aşama başına ilk tamamlamaya 20 kupa, 1000 kupa karşılığı prestij +1. Prestijler kırmızı ayrı sekmede; cihaz rekor listesi kaldırıldı. Beş parçalı avatar düzenleyici. Bartın, Bolu, Zonguldak, Kocaeli ile toplam 64 aşama. Aşama ve altın korunur; eski puanlar kupaya çevrilmez ve yeni sıralamaya dahil değildir. Güncel firestore.rules zorunludur: playerSaves şema 2 ve trophyPlayers. Tüm cihazlarda yeni sürümü kullanın. Spark desteklenir, Blaze gerekmez. Kurulum: FIREBASE-SETUP.md. Blokko.apk aynı dosyanın takma adıdır. Destek: Tirezteknoloji@gmail.com."
